services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls this URL directly, so it must be reachable from the
        # user's machine, not just from inside the Docker network -- keep it
        # as localhost:8000 for local compose use.
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
